<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCraft Solutions | Modern Web & Data Solutions</title>
    <meta name="description" content="Build scalable web applications and data-driven experiences with DevCraft Solutions.">
    <style>
        :root {
        --primary:#4f46e5;
        --primary hover:#4338ca;
        --bg-color: #f9fafb;
        --text-color: #1f2937;
        --card-bg: #ffffff;
        --border-color: #e5e7eb
</head>
<body>

    <!-- Header & Navigation Landmark -->
    <header>
        <div class="logo">
            <span aria-hidden="true">⚡</span> DevCraft Solutions
        </div>
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Landmark -->
    <main>
        
        <!-- Hero Section -->
        <section id="hero">
            <h1>Building the Future of the Web</h1>
            <p>We craft lightning-fast, accessible, and user-centric digital experiences tailored to scale your ideas into reality.</p>
            <img src="web Dev.avif" alt="Vector illustration of developers collaborating on a digital dashboard interface">
        </section>

        <!-- About Section with Proper Heading Hierarchy -->
        <section id="about">
            <h2>Who We Are</h2>
            <p>At DevCraft Solutions, we bridge the gap between complex data and intuitive design. Our mission is to build robust technical foundations that prioritize performance and absolute web accessibility for everyone.</p>
            
            <article>
                <h3>Our Core Philosophy</h3>
                <p>We believe that semantic markup and inclusive design are not mere checkboxes, but the core pillars of a healthy and open internet.</p>
            </article>
        </section>

        <!-- Services Section -->
        <section id="services">
            <h2>What We Do</h2>
            <ul>
                <li>
                    <h3>Web Development</h3>
                    <p>Building semantic, responsive, and high-performance applications using modern web standards.</p>
                </li>
                <li>
                    <h3>UI/UX Architecture</h3>
                    <p>Designing seamless workflows and accessible user interfaces that keep users engaged.</p>
                </li>
                <li>
                    <h3>Data Science Integration</h3>
                    <p>Turning raw data pipelines into actionable visual insights and smart web features.</p>
                </li>
            </ul>
        </section>

        <!-- Accessible Contact Form Section -->
        <section id="contact">
            <h2>Get in Touch</h2>
            <p>Have a project in mind or want to collaborate? Fill out the form below and our team will get back to you shortly.</p>
            
            <form action="#" method="POST">
                <div>
                    <label for="fullname">Full Name <span aria-label="required">*</span></label>
                    <input type="text" id="fullname" name="fullname" required autocomplete="name" placeholder="Akshaya Nair">
                </div>

                <div>
                    <label for="email">Email Address <span aria-label="required">*</span></label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="akshaya@example.com">
                </div>

                <div>
                    <label for="service-select">Select Service Interest</label>
                    <select id="service-select" name="service">
                        <option value="web-dev">Web Development</option>
                        <option value="ui-ux">UI/UX Design</option>
                        <option value="data-science">Data Science</option>
                    </select>
                </div>

                <div>
                    <label for="message">Your Message <span aria-label="required">*</span></label>
                    <textarea id="message" name="message" rows="4" required placeholder="Tell us about your project..."></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </section>

    </main>

    <!-- Footer Landmark -->
    <footer>
        <p>&copy; 2026 DevCraft Solutions. All rights reserved.</p>
        <p>μID: <strong>akshayanair@mulearn</strong></p>
    </footer>

</body>
</html>
